name: Contract checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: contract-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    uses: Company-privacy-settlement/Core/.github/workflows/integration.yml@7257ecf6775653a81a08c786b1346080a68156c9
    with:
      core-ref: 7257ecf6775653a81a08c786b1346080a68156c9
      contract-ref: ${{ github.sha }}
    secrets:
      INTEGRATION_READ_TOKEN: ${{ secrets.INTEGRATION_READ_TOKEN }}
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-wasm
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/core_*.wasm
            artifacts/build-manifest.json
